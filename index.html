<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/c/c2/NOS_Stories_logo.png">
  <title>NOS Stories - Perspectief van de maker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #6530D0;
      --bg-dark:   #4D22A8;
      --bg-darker: #3A1880;
      --white:     #ffffff;
      --dim:       rgba(255,255,255,.65);
      --dim2:      rgba(255,255,255,.35);
      --overlay:   rgba(0,0,0,.18);
      --yellow:    #fadf4b;
      --red:       #e8001d;
      --radius:    12px;
      --radius-lg: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── TOPBAR ─────────────────────────────────────────── */
    .topbar {
      display: flex; align-items: center;
      padding: 14px 28px;
      position: sticky; top: 0; z-index: 100;
      background: rgba(80,35,195,.55);
      backdrop-filter: blur(16px);
    }
    .logo-pill {
      display: inline-flex; align-items: center; gap: 8px;
      background: none;
      border-radius: 10px;
      padding: 6px 12px 6px 6px;
      text-decoration: none;
      cursor: pointer;
    }
    .nos-badge {
      font-weight: 900; font-size: 22px;
      letter-spacing: -.5px;
      color: #fff;
      line-height: 1;
    }
    .nos-badge .o { color: var(--red); }
    .stories-word {
      font-size: 18px; font-weight: 700;
      color: rgba(255,255,255,.9); letter-spacing: -.2px;
    }
    .topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .survey-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 8px 28px;
    }
    .survey-btn {
      display: inline-block;
      background: #FFD700;
      color: #1a0a3c;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -.1px;
      padding: 7px 18px;
      border-radius: 20px;
      text-decoration: none;
      white-space: nowrap;
      transition: background .15s, transform .1s;
    }
    .survey-btn:hover { background: #ffe033; transform: translateY(-1px); }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255,255,255,.18);
      border: none; cursor: pointer;
      display: grid; place-items: center;
      color: var(--white);
      transition: background .15s;
      text-decoration: none;
    }
    .icon-btn:hover { background: rgba(255,255,255,.28); }
    .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* ── VIEWS ──────────────────────────────────────────── */
    .view { display: none; }
    .view.active { display: block; }

    /* ═══════════════════════════════════════════════════════
       OVERVIEW VIEW
    ═══════════════════════════════════════════════════════ */

    /* hero decoration */
    .hero-deco {
      position: relative;
      height: 150px;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }
    .hero-deco svg.blobs {
      position: absolute;
      inset: 0; width: 100%; height: 100%;
    }
    .sparkle {
      position: absolute;
      fill: rgba(255,255,255,.75);
    }
    .sparkle-tl { top: 28%; left: 4%; width: 28px; }
    .sparkle-br { bottom: 14%; right: 4%; width: 22px; }

    /* filters */
    .filters {
      padding: 0 28px 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-pill {
      font-size: 13px; font-weight: 600;
      padding: 8px 18px;
      border-radius: 50px;
      border: none; cursor: pointer;
      background: rgba(0,0,0,.22);
      color: var(--white);
      transition: background .15s;
    }
    .filter-pill:hover { background: rgba(0,0,0,.35); }
    .filter-pill.active {
      background: var(--bg-darker);
      box-shadow: 0 0 0 1px rgba(255,255,255,.15);
    }
    .filter-sep {
      width: 1px; height: 22px;
      background: rgba(255,255,255,.2);
      margin: 0 4px;
      flex-shrink: 0;
    }

    /* video grid */
    .video-grid {
      padding: 0 28px 60px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px 18px;
    }

    .vid-card {
      cursor: pointer;
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: transform .2s;
    }
    .vid-card:hover { transform: translateY(-3px); }

    .vid-thumb {
      position: relative;
      aspect-ratio: 16/9;
      overflow: hidden;
      border-radius: var(--radius-lg);
      background: var(--bg-dark);
    }
    .vid-thumb img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .vid-nos {
      position: absolute; top: 10px; left: 10px;
      background: var(--red);
      color: var(--white);
      font-size: 11px; font-weight: 900;
      padding: 2px 6px; border-radius: 4px;
      letter-spacing: .3px;
    }
    .vid-category-badge {
      position: absolute; bottom: 10px; left: 10px;
      background: rgba(0,0,0,.72);
      color: var(--white);
      font-size: 12px; font-weight: 700;
      padding: 4px 10px; border-radius: 6px;
    }
    .vid-meta {
      padding: 10px 4px 0;
    }
    .vid-meta-row {
      font-size: 11px;
      color: var(--dim);
      margin-bottom: 5px;
    }
    .vid-title {
      font-size: 14px; font-weight: 700;
      line-height: 1.35;
      color: var(--white);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ═══════════════════════════════════════════════════════
       DETAIL VIEW
    ═══════════════════════════════════════════════════════ */
    .detail-wrap {
      max-width: 1140px;
      margin: 0 auto;
      padding: 32px 28px 0;
    }

    /* back button */
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none;
      color: var(--dim); cursor: pointer;
      font-size: 13px; font-weight: 600;
      padding: 0 0 20px;
      transition: color .15s;
    }
    .back-btn:hover { color: var(--white); }
    .back-btn svg { width: 16px; height: 16px; fill: currentColor; }

    /* main 2-col block */
    .detail-main {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 32px;
      align-items: start;
      margin-bottom: 32px;
    }

    /* video player */
    .detail-player {
      border-radius: var(--radius-lg);
      overflow: hidden;
      aspect-ratio: 16/9;
      background: #000;
      position: relative;
      cursor: pointer;
    }
    .detail-player img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .detail-player-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.3);
      display: flex; align-items: center; justify-content: center;
    }
    .big-play {
      width: 72px; height: 72px;
      background: rgba(255,255,255,.9);
      border-radius: 50%;
      display: grid; place-items: center;
    }
    .big-play svg { width: 32px; height: 32px; fill: var(--bg-darker); margin-left: 4px; }
    .detail-nos {
      position: absolute; top: 14px; left: 14px;
      background: var(--red);
      color: var(--white);
      font-size: 12px; font-weight: 900;
      padding: 3px 8px; border-radius: 5px;
    }

    /* info sidebar */
    .detail-info { padding-top: 4px; }
    .detail-category {
      font-size: 12px; font-weight: 700;
      color: var(--dim);
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .detail-title {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -.3px;
      margin-bottom: 18px;
    }
    .detail-desc {
      font-size: 14px; line-height: 1.65;
      color: var(--dim);
      margin-bottom: 22px;
    }
    .share-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--bg-dark);
      color: var(--white);
      font-size: 14px; font-weight: 700;
      padding: 11px 22px;
      border-radius: 50px;
      border: none; cursor: pointer;
      margin-bottom: 28px;
      transition: background .15s;
    }
    .share-btn:hover { background: var(--bg-darker); }
    .share-btn svg { width: 16px; height: 16px; fill: currentColor; }

    .next-label {
      font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px;
      color: var(--dim); margin-bottom: 10px;
    }
    .next-card {
      display: flex; gap: 12px;
      background: rgba(255,255,255,.1);
      border-radius: var(--radius);
      padding: 10px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,.12);
      transition: background .15s;
    }
    .next-card:hover { background: rgba(255,255,255,.16); }
    .next-thumb {
      width: 86px; height: 58px;
      border-radius: 8px;
      overflow: hidden; flex-shrink: 0;
    }
    .next-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .next-title {
      font-size: 13px; font-weight: 600;
      line-height: 1.4;
      align-self: center;
    }

    /* separator */
    .detail-sep {
      border: none;
      border-top: 1px solid rgba(255,255,255,.15);
      margin: 0 0 36px;
    }

    /* ── JOURNALIST SECTION ─────────────────────────────── */
    .journalist-section {
      max-width: 1140px;
      margin: 0 auto 36px;
      padding: 0 28px;
    }
    .journalist-section-inner {
      background: rgba(0,0,0,.22);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 28px;
      align-items: start;
    }

    .journalist-left {
      display: flex; flex-direction: column; align-items: center;
      gap: 10px; min-width: 100px;
    }
    .journalist-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.25);
    }
    .journalist-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .journalist-name-sm {
      font-size: 13px; font-weight: 800;
      text-align: center; line-height: 1.25;
    }
    .journalist-role-sm {
      font-size: 11px; color: var(--dim);
      text-align: center; line-height: 1.3;
    }
    .journalist-years {
      font-size: 11px;
      background: rgba(255,255,255,.12);
      border-radius: 50px;
      padding: 3px 10px;
      color: var(--dim);
      white-space: nowrap;
    }

    .journalist-right {
      display: flex; flex-direction: column; gap: 14px;
    }
    .journalist-right-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .9px;
      color: var(--dim2);
      margin-bottom: 2px;
    }

    .ref-card {
      background: rgba(255,255,255,.08);
      border-radius: var(--radius);
      padding: 18px 20px;
      border: 1px solid rgba(255,255,255,.1);
    }
    .ref-card.highlight {
      border-color: rgba(250,223,75,.4);
      background: rgba(250,223,75,.07);
    }
    .ref-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .7px;
      color: var(--dim);
      margin-bottom: 6px;
      display: flex; align-items: center; gap: 6px;
    }
    .ref-label svg { width: 12px; height: 12px; fill: currentColor; }
    .ref-card.highlight .ref-label { color: var(--yellow); }
    .ref-title {
      font-size: 14px; font-weight: 800;
      margin-bottom: 8px; line-height: 1.3;
    }
    .ref-text {
      font-size: 13px; line-height: 1.65;
      color: var(--dim);
    }

    /* more section */
    .more-section {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 28px 60px;
    }
    .more-label {
      font-size: 19px; font-weight: 900;
      margin-bottom: 20px; letter-spacing: -.2px;
    }
    .more-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px 18px;
    }

    /* ── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 900px) {
      .video-grid { grid-template-columns: repeat(2, 1fr); }
      .detail-main { grid-template-columns: 1fr; }
      .journalist-section-inner { grid-template-columns: 1fr; }
      .journalist-left { flex-direction: row; align-items: center; }
      .more-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 560px) {
      .video-grid { grid-template-columns: 1fr; }
      .more-grid { grid-template-columns: 1fr; }
      .topbar { padding: 12px 16px; }
      .filters, .video-grid { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
